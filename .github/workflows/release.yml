name: Release

# Builds the release artefacts on a macOS runner from the tagged commit and
# publishes them with a provenance attestation, so anyone can verify that the
# tarball they downloaded was produced by this workflow from this source.
#
# Artefacts are a convenience. Building from source with scripts/install.sh
# remains the path that requires trusting nothing but the repository.
#
# Two ways in:
#   * push a tag matching v* — the usual route
#   * run it manually with a version — the workflow creates the tag itself,
#     which is what you want when you cannot push tags from where you are

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v prefix (e.g. 1.0.0)"
        required: true
      ref:
        description: "Branch or commit to tag"
        required: false
        default: main

permissions:
  contents: read

jobs:
  tag:
    name: Resolve the tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Resolve, and create the tag if this was a manual run
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ "${EVENT}" == "workflow_dispatch" ]]; then
            TAG="v${INPUT_VERSION#v}"
          else
            TAG="${REF_NAME}"
          fi
          VERSION="${TAG#v}"

          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'${VERSION}' is not a semantic version"
            exit 1
          fi

          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists at $(git rev-parse --short "refs/tags/${TAG}")"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" -m "remote-shortcuts ${VERSION}"
            git push origin "${TAG}"
            echo "Created tag ${TAG} at $(git rev-parse --short HEAD)"
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  audit:
    name: Supply-chain audit
    needs: tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.tag.outputs.tag }}
      - run: ./scripts/audit-dependencies.sh

  release:
    name: Build and publish
    needs: [tag, audit]
    runs-on: macos-14
    permissions:
      contents: write      # create the release and upload assets
      id-token: write      # sign the provenance attestation
      attestations: write  # record it
    env:
      TAG: ${{ needs.tag.outputs.tag }}
      VERSION: ${{ needs.tag.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.tag.outputs.tag }}
          fetch-depth: 0

      # A tag whose version disagrees with the binary's would produce artefacts
      # that misreport themselves, so fail here rather than ship that.
      - name: Check the tag matches the source version
        run: |
          SOURCE_VERSION="$(sed -n 's/.*let version = "\(.*\)".*/\1/p' Sources/RemoteShortcutsCore/Routes/Routes.swift)"
          PLIST_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          echo "tag=${VERSION} source=${SOURCE_VERSION} plist=${PLIST_VERSION}"
          if [[ "${SOURCE_VERSION}" != "${VERSION}" ]]; then
            echo "::error::BuildInfo.version (${SOURCE_VERSION}) does not match tag ${VERSION}"
            exit 1
          fi
          if [[ "${PLIST_VERSION}" != "${VERSION}" ]]; then
            echo "::error::Info.plist CFBundleShortVersionString (${PLIST_VERSION}) does not match tag ${VERSION}"
            exit 1
          fi

      - name: Test
        run: swift test

      - name: Package
        run: ./scripts/package.sh "${VERSION}"

      - name: Smoke-test the packaged binary
        run: |
          BIN="dist/stage/RemoteShortcuts.app/Contents/MacOS/remote-shortcuts"
          "$BIN" version
          "$BIN" help > /dev/null
          # doctor exits non-zero when permissions are missing, which they are
          # on a runner; we only care that it runs and reports.
          "$BIN" doctor || true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@897ed5eab6ed058a474202017ada7f40bfa52940 # v1.4.3
        with:
          subject-path: dist/remote-shortcuts-*-macos-universal.tar.gz

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARBALL="remote-shortcuts-${VERSION}-macos-universal.tar.gz"
          NOTES_FILE="$(mktemp)"
          {
            echo "## Install"
            echo
            echo '```bash'
            echo "curl -fsSLO https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${TARBALL}"
            echo "curl -fsSLO https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/SHA256SUMS"
            echo "shasum -a 256 -c SHA256SUMS"
            echo "mkdir -p remote-shortcuts && tar -xzf ${TARBALL} -C remote-shortcuts"
            echo "cd remote-shortcuts && ./install.sh"
            echo '```'
            echo
            echo "Or build from source, which requires trusting nothing but this repository:"
            echo
            echo '```bash'
            echo "git clone https://github.com/${GITHUB_REPOSITORY}.git"
            echo "cd remote-shortcuts && git checkout ${TAG} && ./scripts/install.sh"
            echo '```'
            echo
            echo "## Verify"
            echo
            echo "The tarball carries a build provenance attestation tying it to this workflow and commit:"
            echo
            echo '```bash'
            echo "gh attestation verify ${TARBALL} --repo ${GITHUB_REPOSITORY}"
            echo '```'
            echo
            echo "The app bundle inside is ad-hoc signed, not Developer ID signed, so macOS"
            echo "will ask you to approve its privacy permissions on first run."
            echo
            echo "## Changes"
            echo
            # awk, not sed: a sed range never terminates on the last section of
            # the file, so it would sweep up the link definitions at the bottom.
            awk -v ver="${VERSION}" '
              $0 ~ "^## \\[" ver "\\]" { inside = 1; next }
              inside && /^## \[/       { exit }
              inside && /^\[[^]]+\]: / { next }
              inside                   { print }
            ' CHANGELOG.md
          } > "${NOTES_FILE}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "dist/${TARBALL}" dist/SHA256SUMS --clobber
            gh release edit "${TAG}" --notes-file "${NOTES_FILE}"
          else
            gh release create "${TAG}" \
              "dist/${TARBALL}" dist/SHA256SUMS \
              --title "${TAG}" \
              --notes-file "${NOTES_FILE}" \
              --verify-tag
          fi
