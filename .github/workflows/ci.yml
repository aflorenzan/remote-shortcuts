name: CI

# Actions are pinned to full commit SHAs rather than tags. A tag can be moved
# to point at new code; a SHA cannot. This is the same supply-chain rule the
# Swift side follows.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    name: Supply-chain audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify zero dependencies
        run: ./scripts/audit-dependencies.sh
      - name: Lint shell scripts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          # Errors block the build; style suggestions do not.
          shellcheck --severity=error scripts/*.sh

  test:
    name: Build and test (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build -c release
      - name: Test
        run: swift test
      - name: Verify the CLI runs
        run: |
          swift run remote-shortcuts version
          swift run remote-shortcuts help
